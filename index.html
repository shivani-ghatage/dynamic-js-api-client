
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Explorer</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header>
    <h1>Product Explorer</h1>
    <p>Explore products from a live REST API</p>
  </header>

  <main>
    <section class="toolbar">
      <input
        type="search"
        id="searchInput"
        placeholder="Search products..."
        aria-label="Search products"
      >

      <select id="categoryFilter" aria-label="Filter by category">
        <option value="all">All categories</option>
      </select>

      <select id="sortFilter" aria-label="Sort products">
        <option value="default">Default order</option>
        <option value="low-high">Price: Low to High</option>
        <option value="high-low">Price: High to Low</option>
        <option value="name">Name: A to Z</option>
      </select>
    </section>

    <p id="status" role="status" aria-live="polite">
      Loading products...
    </p>

    <p id="cartCount">Cart items: 0</p>

    <section id="productGrid" class="product-grid"></section>
  </main>

  <footer>
    <p>Dynamic JavaScript API Client - Internship Project</p>
  </footer>
</body>
</html>
